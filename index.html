<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Club | Applicant Verification</title>

    <!-- Python / PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0d6efd;
            --primary-dark: #0a58ca;
            --accent: #00c9a7;
            --bg-dark: #0b1120;
            --card-bg: rgba(255, 255, 255, 0.08);
            --text-light: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #0b1120 0%, #1e293b 50%, #0f172a 100%);
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle animated background elements */
        body::before {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(13, 110, 253, 0.15) 0%, transparent 70%);
            top: -200px;
            left: -200px;
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 201, 167, 0.12) 0%, transparent 70%);
            bottom: -150px;
            right: -150px;
            border-radius: 50%;
            pointer-events: none;
        }

        .main-card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
        }

        .club-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(13, 110, 253, 0.2);
            color: #93c5fd;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.35rem 0.9rem;
            border-radius: 999px;
            margin-bottom: 1.25rem;
            letter-spacing: 0.03em;
        }

        .club-badge svg {
            width: 16px;
            height: 16px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
            color: #f8fafc;
            line-height: 1.2;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .form-label {
            color: #cbd5e1;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
        }

        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.25);
            color: #f1f5f9;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .form-control::placeholder {
            color: #64748b;
            font-weight: 400;
        }

        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.25);
            color: #f8fafc;
        }

        .btn-verify {
            background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.85rem;
            border-radius: 0.75rem;
            margin-top: 0.5rem;
            transition: all 0.25s ease;
            letter-spacing: 0.02em;
        }

        .btn-verify:hover {
            background: linear-gradient(135deg, var(--primary-dark) 0%, #2563eb 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(13, 110, 253, 0.4);
            color: white;
        }

        .btn-verify:active {
            transform: translateY(0);
        }

        /* Result area */
        #div1 {
            margin-top: 1.75rem;
            min-height: 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            transition: all 0.3s ease;
        }

        /* Optional: style success/error messages that Python might inject */
        #div1.success {
            background: rgba(0, 201, 167, 0.15);
            color: #5eead4;
            border: 1px solid rgba(0, 201, 167, 0.3);
        }

        #div1.error {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* Footer note */
        .footer-note {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #64748b;
        }

        @media (max-width: 480px) {
            .main-card {
                padding: 2rem 1.5rem;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Bootstrap 5 Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

    <div class="main-card">
        <div class="club-badge">
            <!-- Atom / Science icon -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23-.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5" />
            </svg>
            Science Club
        </div>

        <form>
            <h1>Verification of Applicants</h1>
            <p class="subtitle">Enter your name to verify your application status</p>

            <div class="mb-3">
                <label class="form-label fw-bold">First Name</label>
                <input type="text" class="form-control fw-bold" id="fname" placeholder="Enter Your First Name">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Last Name</label>
                <input type="text" class="form-control fw-bold" id="lname" placeholder="Enter Your Last Name">
            </div>

            <input type="button" class="form-control fw-bold btn-verify" py-click="name_verify" value="Verify">
        </form>

        <div id="div1"></div>

        <div class="footer-note">
            Science Club Applicant Portal
        </div>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
